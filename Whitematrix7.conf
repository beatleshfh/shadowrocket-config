# ============================================================
# Shadowrocket 白名单配置
# 默认直连；仅明确列出的境外服务走代理
# 不含节点、UUID、公钥、私钥、订阅链接或账号凭据
# ============================================================

[General]
dns-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query
bypass-tun = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.88.99.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
skip-proxy = localhost, *.local, injections.adguard.org, local.adguard.org, captive.apple.com, guzzoni.apple.com, 0.0.0.0/8, 10.0.0.0/8, 17.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.88.99.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
bypass-system = true
ipv6 = true
prefer-ipv6 = true
always-real-ip = ddns6.meituogroup.sbs
update-url = https://raw.githubusercontent.com/beatleshfh/shadowrocket-config/main/Whitematrix7.conf

[Rule]
# ---- 0. 管理入口 ----
IP-CIDR,192.204.60.1/32,DIRECT,no-resolve
DOMAIN,vps.meituogroup.sbs,DIRECT

# ---- 1. 局域网与保留地址 ----
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR6,FE80::/10,DIRECT,no-resolve

# ---- 1.5 自有域名与 Synology 官方服务 ----
# NAS / VPS 使用自有域名，必须直连
DOMAIN-SUFFIX,meituogroup.sbs,DIRECT

# Synology Account、Secure SignIn、更新、C2、下载与远程接入
DOMAIN-SUFFIX,synology.com,DIRECT
DOMAIN-SUFFIX,synology.cn,DIRECT
DOMAIN-SUFFIX,synology.me,DIRECT
DOMAIN-SUFFIX,synologydownload.com,DIRECT
DOMAIN-SUFFIX,quickconnect.cn,DIRECT
DOMAIN-SUFFIX,quickconnect.to,DIRECT

# ---- 2. Apple 默认直连 ----
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Apple/Apple.list,DIRECT
DOMAIN-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Apple/Apple_Domain.list,DIRECT

# ---- 3. 明确代理白名单 ----
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Google/Google.list,PROXY
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/YouTube/YouTube.list,PROXY
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/OpenAI/OpenAI.list,PROXY
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Slack/Slack.list,PROXY
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Discord/Discord.list,PROXY
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Gemini/Gemini.list,PROXY
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Copilot/Copilot.list,PROXY

# 无独立规则集的已确认服务
DOMAIN-SUFFIX,poe.com,PROXY
DOMAIN-SUFFIX,grok.com,PROXY
DOMAIN-SUFFIX,x.ai,PROXY
DOMAIN-SUFFIX,arc.net,PROXY
DOMAIN-SUFFIX,thebrowser.company,PROXY

# ---- 4. 广告拦截 ----
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Advertising/Advertising.list,REJECT

# ---- 5. 国内服务兜底 ----
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/China/China.list,DIRECT
GEOIP,CN,DIRECT

# ---- 6. 白名单模式：未明确列出的流量全部直连 ----
FINAL,DIRECT
